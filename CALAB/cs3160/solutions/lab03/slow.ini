# Lab 3, sections 1.2 and 1.3, as the handout dictates them.
#
# 1.2 is the [RAM] section on its own; 1.3 adds the cache. A student ends the
# lab with this whole file, which is why the 1.2 row of answers.txt cannot be
# reproduced from it without commenting the [I1_Cache] block out again.

[RAM]
latency = 100

[I1_Cache]
valid        = true
latency      = 2
size         = 1024
block_size   = 64
assoc        = 1
mapping      = direct
replacement  = FIFO
write_policy = write-back
write_miss   = allocate
